<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Out — App Store Screenshot Composer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1440px;
      height: 900px;
      overflow: hidden;
      background: radial-gradient(130% 90% at 50% 0%, #edf2f7 0%, #d8e2eb 65%, #cdd9e4 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    .composer-layout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 26px;
    }

    /* Top text header */
    .hero-header {
      text-align: center;
      margin-bottom: 20px;
      z-index: 2;
    }

    .hero-headline {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.8px;
      color: #1a2f42;
      line-height: 1.15;
      margin-bottom: 7px;
    }

    .hero-subhead {
      font-size: 16.5px;
      font-weight: 400;
      letter-spacing: -0.15px;
      color: #526b80;
      line-height: 1.35;
    }

    /* macOS Safari-like window container */
    .window-frame {
      width: 1280px;
      height: 790px;
      background: #e8edf2;
      border-radius: 12px;
      box-shadow:
        0 30px 80px rgba(18, 35, 52, 0.20),
        0 10px 28px rgba(18, 35, 52, 0.10),
        0 0 0 1px rgba(36, 56, 74, 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
    }

    /* Safari-like window title bar */
    .window-titlebar {
      height: 40px;
      background: linear-gradient(180deg, #f7f9fa 0%, #ebeff2 100%);
      border-bottom: 1px solid rgba(36, 56, 74, 0.12);
      display: flex;
      align-items: center;
      padding: 0 16px;
      user-select: none;
      flex-shrink: 0;
    }

    /* Traffic lights */
    .traffic-lights {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 90px;
    }

    .traffic-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .dot-close {
      background: #ff5f57;
      border: 0.5px solid rgba(0, 0, 0, 0.15);
    }

    .dot-minimize {
      background: #febc2e;
      border: 0.5px solid rgba(0, 0, 0, 0.15);
    }

    .dot-zoom {
      background: #28c840;
      border: 0.5px solid rgba(0, 0, 0, 0.15);
    }

    /* Address bar */
    .address-bar {
      margin: 0 auto;
      width: 440px;
      height: 26px;
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid rgba(36, 56, 74, 0.14);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: rgba(36, 56, 74, 0.65);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.1px;
    }

    .address-icon {
      width: 12px;
      height: 12px;
      opacity: 0.5;
    }

    .titlebar-spacer {
      width: 90px;
    }

    /* Window inner viewport (renders Tab Out) */
    .window-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #e8edf2;
    }

    .window-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #e8edf2;
    }

    /* Shot 02: Emphasise cards (zoom/crop into cards grid) */
    body.shot-02-grouped .window-viewport iframe {
      transform: scale(1.10) translateY(-22px);
      transform-origin: top center;
    }
  </style>
</head>
<body>
  <div class="composer-layout">
    <div class="hero-header">
      <h1 class="hero-headline" id="headline"></h1>
      <p class="hero-subhead" id="subhead"></p>
    </div>

    <div class="window-frame">
      <div class="window-titlebar">
        <div class="traffic-lights">
          <div class="traffic-dot dot-close"></div>
          <div class="traffic-dot dot-minimize"></div>
          <div class="traffic-dot dot-zoom"></div>
        </div>
        <div class="address-bar">
          <svg class="address-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          <span>New Tab</span>
        </div>
        <div class="titlebar-spacer"></div>
      </div>

      <div class="window-viewport">
        <iframe id="dashboardFrame"></iframe>
      </div>
    </div>
  </div>

  <script>
    const SHOTS = {
      '01-hero': {
        headline: 'All your open tabs. One calm page.',
        subhead: "Tab Out turns Safari's new tab into a clear map of everything you have open.",
      },
      '02-grouped': {
        headline: 'Grouped by site, automatically',
        subhead: 'Every tab sorted into a card per domain, so you find any page in a second.',
      },
      '03-duplicates': {
        headline: 'Spot duplicates. Close them in one click.',
        subhead: 'Same page open twice? Tab Out flags it and keeps just one.',
      },
      '04-saved': {
        headline: 'Save for later, close without guilt',
        subhead: 'Park a tab on your reading list, then clear the clutter.',
      },
      '05-private': {
        headline: '100% local. No account. No tracking.',
        subhead: 'Your tabs never leave your Mac. Free and open source.',
      },
    };

    const params = new URLSearchParams(window.location.search);
    const shot = params.get('shot') || '01-hero';
    const config = SHOTS[shot] || SHOTS['01-hero'];

    document.body.classList.add('shot-' + shot);
    document.getElementById('headline').textContent = config.headline;
    document.getElementById('subhead').textContent = config.subhead;

    const frame = document.getElementById('dashboardFrame');
    frame.src = 'harness.html?shot=' + encodeURIComponent(shot);
  </script>
</body>
</html>
